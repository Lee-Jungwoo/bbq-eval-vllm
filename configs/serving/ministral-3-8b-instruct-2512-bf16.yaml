# vLLM serving config for mistralai/Ministral-3-8B-Instruct-2512-BF16
# Read by scripts/serve.py, which turns it into src/bbq_eval/serve_logprobs.py flags.
# Values are the code defaults that drove the runs, or, where provenance has a
# session_recommendation, the command recommended then. provenance says which
# values a run log actually confirms.

model: "mistralai/Ministral-3-8B-Instruct-2512-BF16"
revision: "f6fae9795746f63c9be8344932f01275f3c63734"   # pinned sha, from results/runs/*/meta.json
params_b: 8   # parsed from the model name (bbq_metrics.family_and_size)

engine:                         # keyword arguments of vllm.LLM(...)
  dtype: bfloat16
  max_model_len: 1024           # longest original-condition prompt: 216 tokens
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  max_num_seqs: null              # null: not passed (vLLM default; 256 in the 2026-07-28 OOM message)
  limit_images: 0               # limit_mm_per_prompt={"image": 0}: vision path off
  quantization: null            # serve_logprobs.py has no quantization flag; never passed

runner:                         # serve_logprobs.py's own flags
  batch_size: 512               # prompts handed to llm.generate() per call
  top_logprobs: 50              # SamplingParams(logprobs=50), LLM(max_logprobs=50)
  max_tokens: 1                 # first-token logprobs only (temperature=1.0, top_p=1.0)

hardware:
  cuda_visible_devices: "1"       # GPU=1 for run_ladder.sh (CUDA_DEVICE_ORDER=PCI_BUS_ID)
  gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server has 2; reported by the user (2026-11-15) and in session 54c52366

provenance:
  original_run: Ministral-3-8B-Instruct-2512-BF16_bfloat16_bae26e21
  forced_choice_run: Ministral-3-8B-Instruct-2512-BF16_bfloat16_ab_76a0399a
  vllm_version: null              # not recorded
  log: null
  confirmed_by_log: []
    # No run log for this model. Every engine/runner value above is the
    # scripts/run_ladder.sh (or serve_logprobs.py) default; whether it was
    # overridden through env vars at run time is not recorded.
  notes: |
    Vision-capable checkpoint. limit_images: 0 follows the usage line in
    scripts/run_ladder.sh and docs/pipeline.md ("Vision-capable models"); no run log
    records the value actually passed.
