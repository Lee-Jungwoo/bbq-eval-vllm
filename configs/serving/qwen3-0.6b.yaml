    gpu_memory_utilization: 0.90
    tensor_parallel_size: 1
    max_num_seqs: null          # null: not passed, vLLM default (256 on both versions used)
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
