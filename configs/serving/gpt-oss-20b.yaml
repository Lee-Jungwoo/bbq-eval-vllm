# vLLM serving config for openai/gpt-oss-20b
# Read by scripts/serve.py, which turns one condition block into
# src/bbq_eval/serve_logprobs.py flags. Every engine value below is what the run
# actually used, read from the vLLM engine log ("non-default args") on the lab
# server, unless provenance.source says otherwise.

model: "openai/gpt-oss-20b"
revision: "6cee5e81ee83917806bbde320786a8fb61efebee"   # pinned sha, from results/runs*/*/meta.json
params_b: 20   # parsed from the model name
gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server: 2 of them (nvidia-smi, driver 555.42.06)

original:
  run_id: gpt-oss-20b_bfloat16_3033cf38
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 279 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: 64
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.26.0"
    engine_quantization: "gpt_oss_mxfp4"   # what the engine applied; no flag was passed
    log: "pipeline/logs/ladder_20260806_100812/gpt-oss-20b.2_serve.log"   # path on the lab server, relative to the repo checkout there
    note: >-
      No quantization flag was passed; the engine picked gpt_oss_mxfp4 from the checkpoint's
      own config.

forced_choice:
  run_id: gpt-oss-20b_bfloat16_ab_658600c7
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 273 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: 64
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.26.0"
    engine_quantization: "gpt_oss_mxfp4"   # what the engine applied; no flag was passed
    log: "bbq_pipeline/logs/ladder_binary_20260819_124535/gpt-oss-20b.2_serve.log"   # path on the lab server, relative to the repo checkout there
    note: >-
      No quantization flag was passed; the engine picked gpt_oss_mxfp4 from the checkpoint's
      own config.
