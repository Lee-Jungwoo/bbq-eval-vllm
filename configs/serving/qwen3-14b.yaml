# vLLM serving config for Qwen/Qwen3-14B
# Read by scripts/serve.py, which turns one condition block into
# src/bbq_eval/serve_logprobs.py flags. Every engine value below is what the run
# actually used, read from the vLLM engine log ("non-default args") on the lab
# server, unless provenance.source says otherwise.

model: "Qwen/Qwen3-14B"
revision: "40c069824f4251a91eefaf281ebe4c544efd3e18"   # pinned sha, from results/runs*/*/meta.json
params_b: 14   # parsed from the model name
gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server: 2 of them (nvidia-smi, driver 555.42.06)

original:
  run_id: Qwen3-14B_bfloat16_a72a53be
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 222 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: 64
    limit_images: null          # null: not passed
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.26.0"
    engine_quantization: null           # quantization=None in the engine log
    log: "pipeline/logs/ladder_20260731_155151/Qwen3-14B.2_serve.log"   # path on the lab server, relative to the repo checkout there
    note: >-
      First attempt (vLLM 0.10.2, TP 2, no max_num_seqs, ladder_20260731_145703) ran out of
      CUDA memory; rerun on vLLM 0.26.0, so this model differs in vLLM version from the rest
      of the Qwen3 ladder.

forced_choice:
  run_id: Qwen3-14B_bfloat16_ab_b61e502c
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 216 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: 64
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.26.0"
    engine_quantization: null           # quantization=None in the engine log
    log: "bbq_pipeline/logs/ladder_binary_20260819_124535/Qwen3-14B.2_serve.log"   # path on the lab server, relative to the repo checkout there
