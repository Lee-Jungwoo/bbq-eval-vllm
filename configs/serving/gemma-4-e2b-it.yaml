# vLLM serving config for google/gemma-4-E2B-it
# Read by scripts/serve.py, which turns one condition block into
# src/bbq_eval/serve_logprobs.py flags. Every engine value below is what the run
# actually used, read from the vLLM engine log ("non-default args") on the lab
# server, unless provenance.source says otherwise.

model: "google/gemma-4-E2B-it"
revision: "3e22461f65e89153144f8adb70e3b8c2cc9845a7"   # pinned sha, from results/runs*/*/meta.json
params_b: 2   # parsed from the model name (effective size)
gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server: 2 of them (nvidia-smi, driver 555.42.06)

original:
  run_id: gemma-4-E2B-it_bfloat16_415e6650
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 233 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: 64
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.26.0"
    engine_quantization: null           # quantization=None in the engine log
    log: "pipeline/logs/ladder_20260805_160146/gemma-4-E2B-it.2_serve.log"   # path on the lab server, relative to the repo checkout there

forced_choice:
  run_id: gemma-4-E2B-it_bfloat16_ab_0cefc4cc
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 225 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 1
    max_num_seqs: 64
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.26.0"
    engine_quantization: null           # quantization=None in the engine log
    log: "bbq_pipeline/logs/ladder_binary_20260819_154658/gemma-4-E2B-it.2_serve.log"   # path on the lab server, relative to the repo checkout there
