# vLLM serving config for Qwen/Qwen2.5-14B-Instruct
# Read by scripts/serve.py, which turns one condition block into
# src/bbq_eval/serve_logprobs.py flags. Every engine value below is what the run
# actually used, read from the vLLM engine log ("non-default args") on the lab
# server, unless provenance.source says otherwise.

model: "Qwen/Qwen2.5-14B-Instruct"
revision: "cf98f3b3bbb457ad9e2bb7baf9a0125b6b88caa8"   # pinned sha, from results/runs*/*/meta.json
params_b: 14   # parsed from the model name
gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server: 2 of them (nvidia-smi, driver 555.42.06)

original:
  run_id: Qwen2.5-14B-Instruct_bfloat16_49eb7f5a
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: not recorded in meta.json
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: 64
    limit_images: null          # null: not passed
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.10.2"
    engine_quantization: null           # quantization=None in the engine log
    log: "pipeline/logs/ladder_20260728_111232/Qwen2.5-14B-Instruct.2_serve.log"   # path on the lab server, relative to the repo checkout there
    note: >-
      Earlier attempts failed: TP 1 with gpu_memory_utilization 0.95 (ladder_20260728_105529,
      weights do not fit one GPU) and TP 2 without max_num_seqs (ladder_20260728_110046, OOM
      in the sampler warmup with 256 dummy requests).

