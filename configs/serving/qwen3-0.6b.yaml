# vLLM serving config for Qwen/Qwen3-0.6B
# Read by scripts/serve.py, which turns one condition block into
# src/bbq_eval/serve_logprobs.py flags. Every engine value below is what the run
# actually used, read from the vLLM engine log ("non-default args") on the lab
# server, unless provenance.source says otherwise.

model: "Qwen/Qwen3-0.6B"
revision: "c1899de289a04d12100db370d81485cdf75e47ca"   # pinned sha, from results/runs*/*/meta.json
params_b: 0.6   # parsed from the model name
gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server: 2 of them (nvidia-smi, driver 555.42.06)

original:
  run_id: Qwen3-0.6B_bfloat16_e0bcf270
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 222 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: null          # null: not passed, vLLM default (256 on both versions used)
    limit_images: null          # null: not passed
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.10.2"
    engine_quantization: null           # quantization=None in the engine log
    log: "pipeline/logs/ladder_20260731_145703/Qwen3-0.6B.2_serve.log"   # path on the lab server, relative to the repo checkout there

forced_choice:
  run_id: Qwen3-0.6B_bfloat16_ab_113a141d
