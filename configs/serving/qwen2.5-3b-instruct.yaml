# vLLM serving config for Qwen/Qwen2.5-3B-Instruct
# Read by scripts/serve.py, which turns it into src/bbq_eval/serve_logprobs.py flags.
# Values are the code defaults that drove the runs, or, where provenance has a
# session_recommendation, the command recommended then. provenance says which
# values a run log actually confirms.

model: "Qwen/Qwen2.5-3B-Instruct"
revision: "aa8e72537993ba99e69dfaafa59ed015b17504d1"   # pinned sha, from results/runs/*/meta.json
params_b: 3   # parsed from the model name (bbq_metrics.family_and_size)

engine:                         # keyword arguments of vllm.LLM(...)
  dtype: bfloat16
  max_model_len: 1024           # prompt length of this run: not recorded in meta.json
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  max_num_seqs: null              # null: not passed (vLLM default; 256 in the 2026-07-28 OOM message)
  limit_images: null            # null: flag not passed (text-only model)
  quantization: null            # serve_logprobs.py has no quantization flag; never passed

runner:                         # serve_logprobs.py's own flags
  batch_size: 512               # prompts handed to llm.generate() per call
  top_logprobs: 50              # SamplingParams(logprobs=50), LLM(max_logprobs=50)
  max_tokens: 1                 # first-token logprobs only (temperature=1.0, top_p=1.0)

hardware:
  cuda_visible_devices: "1"       # GPU=1 for run_ladder.sh (CUDA_DEVICE_ORDER=PCI_BUS_ID)
  gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server has 2; reported by the user (2026-11-15) and in session 54c52366

provenance:
  original_run: Qwen2.5-3B-Instruct_bfloat16_6db43b09
  forced_choice_run: Qwen2.5-3B-Instruct_bfloat16_ab_76487206
  vllm_version: "0.10.2"          # from the engine log
  log: "results/serving_logs/ladder_20260725_195436/Qwen2.5-3B-Instruct.2_serve.log"
  confirmed_by_log: [dtype, max_model_len, gpu_memory_utilization, tensor_parallel_size, max_num_seqs,
                     limit_images, quantization, batch_size, top_logprobs, max_tokens]
    # Original-condition run only. The forced-choice run of this model has no log.
