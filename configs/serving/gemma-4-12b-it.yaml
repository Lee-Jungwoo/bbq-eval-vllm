# vLLM serving config for google/gemma-4-12B-it
# Read by scripts/serve.py, which turns one condition block into
# src/bbq_eval/serve_logprobs.py flags. Every engine value below is what the run
# actually used, read from the vLLM engine log ("non-default args") on the lab
# server, unless provenance.source says otherwise.

model: "google/gemma-4-12B-it"
revision: "707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7"   # pinned sha, from results/runs*/*/meta.json
params_b: 12   # parsed from the model name
gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server: 2 of them (nvidia-smi, driver 555.42.06)

original:
  run_id: gemma-4-12B-it_bfloat16_9d7b3a67
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 237 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 2
    max_num_seqs: 64
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0,1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: server_log            # engine args read from the vLLM log of the run
    vllm_version: "0.26.0"
    engine_quantization: null           # quantization=None in the engine log
    log: "pipeline/logs/ladder_20260805_160146/gemma-4-12B-it.2_serve.log"   # path on the lab server, relative to the repo checkout there

