# vLLM serving config for Qwen/Qwen2.5-7B-Instruct
# Read by scripts/serve.py, which turns one condition block into
# src/bbq_eval/serve_logprobs.py flags. Every engine value below is what the run
# actually used, read from the vLLM engine log ("non-default args") on the lab
# server, unless provenance.source says otherwise.

model: "Qwen/Qwen2.5-7B-Instruct"
revision: "a09a35458c702b33eeacc393d103063234e8bc28"   # pinned sha, from results/runs*/*/meta.json
params_b: 7   # parsed from the model name
gpu: "NVIDIA GeForce RTX 3090 24GB"   # lab server: 2 of them (nvidia-smi, driver 555.42.06)

original:
  run_id: Qwen2.5-7B-Instruct_bfloat16_073fb259
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: not recorded in meta.json
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 1
    max_num_seqs: null          # null: not passed, vLLM default (256 on both versions used)
    limit_images: null          # null: not passed
  runner:                       # serve_logprobs.py's own flags
    batch_size: 256
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "1"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
  provenance:
    source: shell_history         # no engine log; command from the server's shell history
    vllm_version: null
    engine_quantization: null
    log: null
    note: >-
      Run by hand before the ladder script existed: CUDA_DEVICE_ORDER=PCI_BUS_ID
      CUDA_VISIBLE_DEVICES=1 python serve_logprobs.py ... --dtype bfloat16 --max-model-len
      1024 (server shell history). batch_size is serve_logprobs.py's default at the time
      (256); some resumed invocations passed --batch-size 64. No engine log, so the vLLM
      version is not recorded (the same-day ladder used 0.10.2).

forced_choice:
  run_id: Qwen2.5-7B-Instruct_bfloat16_ab_54547fea
  engine:                       # keyword arguments of vllm.LLM(...)
    dtype: bfloat16
    max_model_len: 1024         # longest prompt: 233 tokens
    gpu_memory_utilization: 0.90
    tensor_parallel_size: 1
    max_num_seqs: null          # null: not passed, vLLM default (256 on both versions used)
    limit_images: 0          # limit_mm_per_prompt={"image": 0}
  runner:                       # serve_logprobs.py's own flags
    batch_size: 512
    top_logprobs: 50
    max_tokens: 1
  hardware:
    cuda_visible_devices: "0"   # CUDA_DEVICE_ORDER=PCI_BUS_ID
